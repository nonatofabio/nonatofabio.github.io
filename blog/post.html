<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Fabio Nonato de Paula</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="robots" content="noindex">
    <!-- Legacy URL shim: posts moved from post.html?slug=<slug> to static
         pages at posts/<slug>.html. Redirect old links to the new location. -->
    <script>
        var slug = new URLSearchParams(window.location.search).get('slug');
        if (slug && /^[A-Za-z0-9_-]+$/.test(slug)) {
            window.location.replace('./posts/' + slug + '.html');
        } else {
            window.location.replace('./');
        }
    </script>
</head>
<body>
    <p>This post has moved. <a href="./">Browse all posts</a>.</p>
</body>
</html>
